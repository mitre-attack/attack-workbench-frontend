# Default for the production image. Deployment may mount its own server config
# over this file to add API proxying or TLS; this default only serves the SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Runtime settings can change without rebuilding the application bundles.
    location = /assets/config.json {
        add_header Cache-Control "no-store" always;
    }
    # Let Angular handle application routes when no static file matches.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
