<div class="add-dialog">
  <h1 *ngIf="config.title" mat-dialog-title>{{ config.title }}</h1>
  <mat-dialog-content>
    <div *ngIf="hasSelectableContent; else nothing">
      <mat-checkbox
        *ngIf="config.showPreserveRelationshipsOption"
        color="primary"
        [(ngModel)]="config.preserveRelationships"
        >Preserve relationships - If set to true, relationships referencing the
        revoked object are cloned to point to the revoking object before
        deprecation.
      </mat-checkbox>
      <app-stix-list
        *ngIf="config.type !== 'user'"
        [config]="
          config.stixListConfig || {
            select: config.selectionType
              ? config.selectionType
              : config.select
                ? 'many'
                : 'disabled',
            selectionModel: config.select,
            type: config.type,
            clickBehavior: 'expand',
            stixObjects: config.selectableObjects
              ? config.selectableObjects
              : undefined,
            showFilters: false,
          }
        "></app-stix-list>
      <app-users-list
        *ngIf="config.type === 'user'"
        [config]="{
          mode: 'select',
          columnsToDisplay: ['username', 'email'],
          showFilters: false,
          showSearch: true,
          selection: config.select,
        }"></app-users-list>
    </div>
    <ng-template #nothing>
      <h3>No available objects to add.</h3>
    </ng-template>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    <ng-container *ngIf="hasSelectableContent; else closeDialog">
      <button
        mat-raised-button
        class="extended-button left-button"
        color="primary"
        (click)="dialogRef.close(true)">
        <span class="text-label">{{
          config.buttonLabel ? config.buttonLabel : 'ADD'
        }}</span>
      </button>
      <button
        *ngIf="config.clearSelection"
        mat-raised-button
        class="extended-button"
        color="primary"
        (click)="clearSelections()">
        <span class="text-label">Clear</span>
      </button>
      <button
        mat-raised-button
        class="extended-button right-button"
        color="primary"
        (click)="dialogRef.close()">
        <span class="text-label">Cancel</span>
      </button>
    </ng-container>
    <ng-template #closeDialog>
      <button class="extended-button" mat-raised-button mat-dialog-close>
        close
      </button>
    </ng-template>
  </mat-dialog-actions>
</div>
